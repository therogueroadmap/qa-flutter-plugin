  # ----------------------------------------------------------
  # BUILD — Chrome autofill interference in headed mode
  # Registrado por: usuario (caso observado: wizard multi-paso en Flutter web de prueba)
  # Contexto: tests de validación que escriben values inválidos a propósito
  # (ej. 'not-a-valid-email') fallan en modo --headed porque Chrome autofill
  # pisa el value con uno guardado de runs previos antes de que Flutter valide.
  # Workaround: lockInputValue después del fill — congela el getter.
  # ----------------------------------------------------------
  - id: "K016"
    registered_at: "2026-05-20"
    registered_by: "user"
    category: "build"
    description: "Chrome autofill (modo headed) puede pisar values escritos por fill() en tests de validación"
    enabled: true

    pattern: "test\\.skip.*autofill|Chrome autofill|insertFromAutofill"

    preflight_check: null

    solution:
      auto_apply: false
      type: "manual"
      steps:
        - cmd: "echo 'Patrón estructural — sin auto-apply. Ver fallback_message.'"
          wait_seconds: 0
          description: "Aviso al usuario"
      fallback_message: |
        En modo --headed, Chrome comparte el profile del browser entre tests del
        mismo `npx playwright test` run. Si un test 1 escribe 'qa@example.com' en
        'Email *', el siguiente test que escriba 'not-a-valid-email'
        en el mismo input puede ser pisado por el autofill ANTES de que Flutter
        valide. Resultado: el test de validación de error pasa el step sin disparar
        validación, y falla por timeout esperando 'Email inválido'.

        Workaround: lockInputValue después del fill (congela el getter del input):

        ```typescript
        await fillInput(page, 'Email *', 'not-a-valid-email');
        await lockInputValue(page, 'Email *', 'not-a-valid-email');
        await tapButton(page, 'Siguiente');
        ```

        Si no quieres lock (puede tener side-effects en interacciones siguientes),
        alternativas:
        - Correr en --headless (default; no hay autofill activo).
        - Detectar el fallback en el test y test.skip con mensaje claro
          (ver el spec del wizard de tu proyecto).

        Este patrón está implementado en `lockInputValue` del _helpers.ts
        del driver a partir de v1.5.1.

    stats:
      applied_count: 0
      last_applied: null
      last_result: null

