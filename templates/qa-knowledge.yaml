  # ----------------------------------------------------------
  # BUILD — Flutter web (CanvasKit) unlabeled textbox: dispatch + keyboard.type
  # Registrado por: usuario (caso observado: wizard multi-paso en Flutter web de prueba)
  # Contexto: campos como teléfono o numéricos donde TextFormField no tiene
  # labelText, no exponen aria-label en el flt-semantics. fillInput por aria-label
  # no aplica. La estrategia es dispatch chain sobre el primer flt-semantics
  # [role="textbox"] sin aria-label + keyboard.type (escribe en el activeElement).
  # ----------------------------------------------------------
  - id: "K015"
    registered_at: "2026-05-20"
    registered_by: "user"
    category: "build"
    description: "Flutter web CanvasKit: inputs sin aria-label requieren dispatch + keyboard.type (no fill)"
    enabled: true

    # Pattern (ampliado en v1.6.1, fixed cross-line en v1.6.2):
    #   Directa: fillUnlabeledTextbox no encontró un textbox sin aria-label.
    #   Indirecta (caso observado en un wizard de prueba): el helper aparentó funcionar
    #   (no tiró error) pero el value no se commiteó → el form quedó con un mensaje de campo
    #   obligatorio en el campo de teléfono y el wizard no avanzó al siguiente paso. El síntoma visible es
    #   TimeoutError esperando un input del paso siguiente. Coincide con K013 indirecto;
    #   ambos matchean y el modelo elige según contexto del helper que se llamó.
    # Cross-line safe: usamos [\s\S]* (ver nota en K013).
    pattern: "flt-semantics\\[role=.textbox.\\][\\s\\S]*no[\\s\\S]*aria-label|unlabeled[\\s\\S]*textbox|(?:[Oo]bligatori[oa]|[Rr]equired)[^\\n]{0,80}(?:Tel[eé]fono|Phone)|fillUnlabeledTextbox[\\s\\S]*Timeout|TimeoutError[\\s\\S]*locator[\\s\\S]*input\\[aria-label[\\s\\S]*\\*?\\\"\\][\\s\\S]*(?:after|tras)[\\s\\S]*fillUnlabeled"

    preflight_check: null

    solution:
      auto_apply: false
      type: "manual"
      steps:
        - cmd: "echo 'Patrón estructural — sin auto-apply. Ver fallback_message.'"
          wait_seconds: 0
          description: "Aviso al usuario"
      fallback_message: |
        Para llenar un input sin aria-label (típicamente teléfonos en Flutter):

        ```typescript
        async function fillUnlabeledTextbox(page, value) {
          await page.evaluate(() => (document.activeElement)?.blur());
          await page.waitForTimeout(100);
          const found = await page.evaluate(() => {
            const t = Array.from(document.querySelectorAll('flt-semantics[role="textbox"]'))
              .find(el => !el.getAttribute('aria-label'));
            if (!t) return false;
            const r = t.getBoundingClientRect();
            const o = { bubbles:true, cancelable:true,
              clientX:r.x+r.width/2, clientY:r.y+r.height/2, button:0 };
            ['pointerdown','mousedown','pointerup','mouseup','click'].forEach(type =>
              t.dispatchEvent(new (type.startsWith('pointer')?PointerEvent:MouseEvent)(type, o))
            );
            return true;
          });
          if (!found) throw new Error('no unlabeled textbox found');
          await page.waitForTimeout(200);
          await page.keyboard.type(value);
          await page.waitForTimeout(200);
        }
        ```

        Por qué keyboard.type y no fill:
        - keyboard.type escribe en el elemento con foco del browser (activeElement).
        - El dispatch chain anterior dio foco al input on-demand de Flutter (creado
          en flt-text-editing-host al recibir el tap).
        - keyboard.type entonces escribe letra a letra al TextEditingController.

        Limitación: si hay múltiples flt-semantics[role="textbox"] sin aria-label
        en la misma pantalla, el helper agarra el primero (orden DOM). Para
        identificar uno específico, agregar Semantics(label: 'X') al widget en
        Flutter (preferido) o usar un selector más específico por posición.

        Este patrón está implementado en `fillUnlabeledTextbox` del _helpers.ts
        del driver a partir de v1.5.1.

        ─── Si este match fue INDIRECTO (v1.6.1) ───
        Caso observado: `fillUnlabeledTextbox` aparentó funcionar pero el
        teléfono quedó vacío en el form. Visible: mensaje de campo obligatorio en el
        campo de teléfono
        + TimeoutError esperando el input del paso siguiente.

        Hipótesis a validar en --headed con DevTools:
          1. ¿El selector `flt-semantics[role="textbox"]` SIN aria-label agarró
             OTRO nodo (ej. un campo opcional que aparece antes en el DOM)?
             Fix: filtrar por posición o agregar Semantics(label) al widget.
          2. ¿El dispatch chain disparó pero keyboard.type escribió en otro
             activeElement (ej. el foco se perdió antes de keyboard.type)?
             Fix: agregar `await page.waitForTimeout(400)` antes de keyboard.type
             para asegurar que Flutter creó el input on-demand.
          3. ¿El número escrito tiene formato inválido (ej. prefijo + número con
             espacios) y el TextFormField lo rechaza silenciosamente?
             Fix: usar value sin caracteres especiales o ajustar el inputFormatter
             del widget Dart.

